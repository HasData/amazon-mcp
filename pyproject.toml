[project]
name = "hasdata-amazon-mcp"
version = "1.0.0"
description = "MCP server for Amazon through HasData's hosted API. 1,000 free credits every month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "amazon", "ecommerce", "product-data", "asin", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/amazon-api"
Repository = "https://github.com/HasData/amazon-mcp"

[project.scripts]
hasdata-amazon-mcp = "hasdata_amazon_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_amazon_mcp"]
